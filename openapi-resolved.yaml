openapi: 3.0.0
info:
  title: Contact Person API
  version: 1.0.0
servers:
- url: https://sukacarimasalah
  description: production server

paths:
  /contacts:
    post:
      summary: Create a new contact
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Contact"
        required: true
      responses:
        "201":
          description: Contact created


components:
  schemas:
    Contact:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        message:
          type: string
